name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: persona tests
        run: bash skills/_devkit/persona_test.sh
      - name: shellcheck
        run: shellcheck skills/dev-tab/herdr-tab skills/_devkit/persona_test.sh
